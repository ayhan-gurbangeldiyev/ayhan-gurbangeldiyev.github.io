<figure class="technical-figure">
  <a href="{{ include.src | relative_url }}" aria-label="View full-size diagram: {{ include.alt | escape }}"><img src="{{ include.src | relative_url }}" alt="{{ include.alt | escape }}" width="{{ include.width | default: 960 }}" height="{{ include.height | default: 540 }}" loading="lazy" decoding="async"></a>
  {% if include.caption %}<figcaption>{{ include.caption | escape }}</figcaption>{% endif %}
</figure>
