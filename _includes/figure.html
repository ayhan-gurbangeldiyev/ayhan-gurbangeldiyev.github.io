<figure class="technical-figure">
  <a href="{{ include.src | absolute_url }}" aria-label="View full-size diagram: {{ include.alt | escape }}">{% if include.fallback %}<picture><source srcset="{{ include.src | absolute_url }}" type="image/svg+xml">{% endif %}<img src="{{ include.fallback | default: include.src | absolute_url }}" alt="{{ include.alt | escape }}" width="{{ include.width | default: 960 }}" height="{{ include.height | default: 540 }}" loading="lazy" decoding="async">{% if include.fallback %}</picture>{% endif %}</a>
  {% if include.caption %}<figcaption>{{ include.caption | escape }}</figcaption>{% endif %}
</figure>
