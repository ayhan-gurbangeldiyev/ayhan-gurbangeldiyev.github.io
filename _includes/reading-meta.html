{%- assign words = include.post.content | strip_html | number_of_words -%}
{%- assign minutes = words | plus: 219 | divided_by: 220 | at_least: 1 -%}
<span class="reading-meta"><time datetime="{{ include.post.date | date_to_xmlschema }}">{{ include.post.date | date: '%b %-d, %Y' }}</time><span aria-hidden="true"> / </span><span>{{ minutes }} min read</span></span>
