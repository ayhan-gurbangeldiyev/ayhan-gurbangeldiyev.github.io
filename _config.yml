markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter: rouge
  auto_ids: true
  toc_levels: "2..3"
feed:
  posts_limit: 50
  excerpt_only: false
social:
  name: Ayhan Gurbangeldiyev
  links:
    - "https://github.com/ayhan-gurbangeldiyev"
    - "https://www.linkedin.com/in/ayhan-gurbangeldiyev/"
    - "https://ayhangurbangeldiyev.com/"
    - "https://www.youtube.com/@ayhangurbangeldiyev"
defaults:
  - scope:
      path: ""
    values:
      layout: page
      image:
        path: /assets/images/engineering-notes-social.png
        width: 1200
        height: 630
        alt: "GitHub Blog by Ayhan Gurbangeldiyev. Field notes on building reliable AI systems."
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      toc: true
      article_type: Engineering note
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - docs
  - templates
  - scripts
  - vendor
  - LICENSE-visuals.md
  - package.json
  - package-lock.json
  - _site-preview
