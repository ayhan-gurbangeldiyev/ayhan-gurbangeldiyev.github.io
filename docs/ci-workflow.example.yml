# Optional validation-only Actions workflow. Copy to .github/workflows/validate.yml
# using a GitHub credential permitted to update workflow files.
# No Pages deployment permissions or publishing step are included.
name: Validate publication
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - run: bundle exec jekyll build --safe --strict_front_matter
        env:
          JEKYLL_ENV: production
      - run: python3 scripts/check_site.py _site
