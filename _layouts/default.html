<!doctype html>
<html lang="{{ page.lang | default: site.lang | default: 'en' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#f8f6f2" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#171419" media="(prefers-color-scheme: dark)">
    {% seo %}
    {% if page.noindex %}<meta name="robots" content="noindex,follow">{% endif %}
    {% feed_meta %}
    <link rel="icon" href="{{ '/assets/images/favicon.png' | relative_url }}" type="image/png" sizes="96x96">
    <link rel="apple-touch-icon" href="{{ '/assets/images/apple-touch-icon.png' | relative_url }}" sizes="180x180">
    <script src="{{ '/assets/js/theme.js' | relative_url }}"></script>
    <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
    <script src="{{ '/assets/js/site.js' | relative_url }}" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    {% include header.html %}
    <main id="main" tabindex="-1">{{ content }}</main>
    {% include footer.html %}
  </body>
</html>
