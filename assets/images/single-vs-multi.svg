<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="title desc"><title id="title">Single-agent and multi-agent coordination</title><desc id="desc">Left: task, one agent with tools, verified outcome. Right: task and coordinator delegate independent work to agents A and B, then synthesize and verify. Shared context, handoffs and conflict resolution add work.</desc><defs><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".7" fill="#c8c0c8" opacity=".6"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 8 5 L 0 9" fill="none" stroke="#3a617c" stroke-width="1.5"/></marker></defs><rect width="960" height="600" fill="#f8f6f2"/><text x="38" y="43" fill="#625d65" font-family="ui-monospace, monospace" font-size="15" font-weight="400" text-anchor="start">01 / TWO ARCHITECTURES, DIFFERENT COORDINATION WORK</text><text x="60" y="95" fill="#171419" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="500" text-anchor="start">Single agent</text><text x="525" y="95" fill="#171419" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="500" text-anchor="start">Coordinated agents</text><path d="M480 78 V558" stroke="#c8c0c8" stroke-dasharray="4 7"/><rect x="100" y="125" width="280" height="65" rx="5" fill="#fcfbf9" stroke="#c8c0c8" stroke-width="1.5"/><text x="240.0" y="164.5" fill="#171419" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="500" text-anchor="middle">Task</text><rect x="100" y="242" width="280" height="90" rx="5" fill="#fcfbf9" stroke="#c8c0c8" stroke-width="1.5"/><text x="240.0" y="287.0" fill="#171419" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="500" text-anchor="middle">Agent + tools</text><text x="240.0" y="312.0" fill="#625d65" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="middle">One working context</text><rect x="100" y="395" width="280" height="75" rx="5" fill="#e4ebef" stroke="#3a617c" stroke-width="1.5"/><text x="240.0" y="439.5" fill="#171419" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="500" text-anchor="middle">Verified outcome</text><path d="M240 190 L240 242" stroke="#3a617c" stroke-width="1.7" fill="none" marker-end="url(#arrow)"/><path d="M240 332 L240 395" stroke="#3a617c" stroke-width="1.7" fill="none" marker-end="url(#arrow)"/><text x="240" y="520" fill="#625d65" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" text-anchor="middle">Sequential dependencies stay local.</text><rect x="570" y="125" width="280" height="60" rx="5" fill="#fcfbf9" stroke="#c8c0c8" stroke-width="1.5"/><text x="710.0" y="162.0" fill="#171419" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="500" text-anchor="middle">Task + coordinator</text><rect x="510" y="245" width="175" height="70" rx="5" fill="#fcfbf9" stroke="#c8c0c8" stroke-width="1.5"/><text x="597.5" y="280.0" fill="#171419" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="500" text-anchor="middle">Agent A</text><text x="597.5" y="305.0" fill="#625d65" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="middle">Independent work</text><rect x="735" y="245" width="175" height="70" rx="5" fill="#fcfbf9" stroke="#c8c0c8" stroke-width="1.5"/><text x="822.5" y="280.0" fill="#171419" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="500" text-anchor="middle">Agent B</text><text x="822.5" y="305.0" fill="#625d65" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="middle">Independent work</text><path d="M710 185 V214 H597 V245" stroke="#3a617c" stroke-width="1.7" fill="none" marker-end="url(#arrow)"/><path d="M710 214 H822 V245" stroke="#3a617c" stroke-width="1.7" fill="none" marker-end="url(#arrow)"/><rect x="570" y="366" width="280" height="65" rx="5" fill="#eee2e8" stroke="#b68a9f" stroke-width="1.5"/><text x="710.0" y="405.5" fill="#171419" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="500" text-anchor="middle">Synthesis + verification</text><path d="M597 315 V342 H710 V366" stroke="#3a617c" stroke-width="1.7" fill="none" marker-end="url(#arrow)"/><path d="M822 315 V342 H719" stroke="#3a617c" stroke-width="1.7" fill="none" marker-end="url(#arrow)"/><rect x="570" y="481" width="280" height="65" rx="5" fill="#e4ebef" stroke="#3a617c" stroke-width="1.5"/><text x="710.0" y="520.5" fill="#171419" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="500" text-anchor="middle">Verified outcome</text><path d="M710 431 L710 481" stroke="#3a617c" stroke-width="1.7" fill="none" marker-end="url(#arrow)"/><text x="710" y="583" fill="#625d65" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="middle">Added work: context, handoffs, conflict resolution.</text></svg>