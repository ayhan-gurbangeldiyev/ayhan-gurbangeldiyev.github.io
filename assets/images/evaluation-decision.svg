<svg xmlns="http://www.w3.org/2000/svg" width="960" height="680" viewBox="0 0 960 680" role="img" aria-labelledby="title desc"><title id="title">Evaluation before coordination</title><desc id="desc">Create a baseline. If useful subtasks are independent, compare architectures under specified budgets and inspect outcomes, errors, latency and cost over repeated trials. Adopt coordination only if its benefits justify its overhead; otherwise retain the baseline.</desc><defs><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".7" fill="#c8c0c8" opacity=".6"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 8 5 L 0 9" fill="none" stroke="#3a617c" stroke-width="1.5"/></marker></defs><rect width="960" height="680" fill="#f8f6f2"/><text x="38" y="43" fill="#625d65" font-family="ui-monospace, monospace" font-size="15" font-weight="400" text-anchor="start">02 / LET THE EVALUATION MAKE THE CASE</text><rect x="180" y="78" width="600" height="68" rx="5" fill="#fcfbf9" stroke="#c8c0c8" stroke-width="1.5"/><text x="480.0" y="119.0" fill="#171419" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="500" text-anchor="middle">Define representative tasks + single-agent baseline</text><path d="M480 146 L480 184" stroke="#3a617c" stroke-width="1.7" fill="none" marker-end="url(#arrow)"/><rect x="230" y="184" width="500" height="68" rx="5" fill="#eee2e8" stroke="#b68a9f" stroke-width="1.5"/><text x="480.0" y="225.0" fill="#171419" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="500" text-anchor="middle">Can useful subtasks run independently?</text><path d="M730 218 H860 V536" stroke="#3a617c" stroke-width="1.7" fill="none" marker-end="url(#arrow)"/><text x="804" y="204" fill="#625d65" font-family="ui-monospace, monospace" font-size="16" font-weight="400" text-anchor="start">No</text><path d="M480 252 L480 295" stroke="#3a617c" stroke-width="1.7" fill="none" marker-end="url(#arrow)"/><text x="500" y="281" fill="#625d65" font-family="ui-monospace, monospace" font-size="16" font-weight="400" text-anchor="start">Yes</text><rect x="180" y="295" width="600" height="82" rx="5" fill="#fcfbf9" stroke="#c8c0c8" stroke-width="1.5"/><text x="480.0" y="336.0" fill="#171419" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="500" text-anchor="middle">Compare architectures under explicit budgets</text><text x="480.0" y="361.0" fill="#625d65" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="middle">Same model versions, tools, inputs; repeat trials</text><path d="M480 377 L480 415" stroke="#3a617c" stroke-width="1.7" fill="none" marker-end="url(#arrow)"/><rect x="180" y="415" width="600" height="82" rx="5" fill="#e4ebef" stroke="#3a617c" stroke-width="1.5"/><text x="480.0" y="456.0" fill="#171419" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="500" text-anchor="middle">Inspect the actual outcome</text><text x="480.0" y="481.0" fill="#625d65" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="middle">Completion · errors · latency · cost, including coordination</text><path d="M480 497 L480 536" stroke="#3a617c" stroke-width="1.7" fill="none" marker-end="url(#arrow)"/><rect x="180" y="536" width="555" height="72" rx="5" fill="#fcfbf9" stroke="#c8c0c8" stroke-width="1.5"/><text x="457.5" y="572.0" fill="#171419" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="500" text-anchor="middle">Does the benefit justify the coordination?</text><text x="457.5" y="597.0" fill="#625d65" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="middle">Use the application’s constraints, not agent count</text><rect x="760" y="536" width="180" height="72" rx="5" fill="#efede8" stroke="#c8c0c8" stroke-width="1.5"/><text x="850.0" y="579.0" fill="#171419" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="500" text-anchor="middle">Retain baseline</text><text x="480" y="651" fill="#3a617c" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="middle">Adopt if justified. Otherwise retain the baseline and investigate.</text></svg>