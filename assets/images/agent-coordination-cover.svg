<svg xmlns="http://www.w3.org/2000/svg" width="560" height="400" viewBox="0 0 560 400" role="img" aria-labelledby="title desc"><title id="title">Before adding a second agent</title><desc id="desc">A task branches to two agents whose work must be combined and verified. The diagram makes no performance claim.</desc><defs><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".7" fill="#c8c0c8" opacity=".6"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 8 5 L 0 9" fill="none" stroke="#3a617c" stroke-width="1.5"/></marker></defs><rect width="560" height="400" fill="#eae5e9"/><rect x="24" y="24" width="512" height="352" fill="url(#grid)"/><text x="38" y="52" fill="#625d65" font-family="ui-monospace, monospace" font-size="12" font-weight="400" text-anchor="start">ONE MORE AGENT.</text><text x="38" y="76" fill="#625d65" font-family="ui-monospace, monospace" font-size="12" font-weight="400" text-anchor="start">ONE MORE REASON TO MEASURE.</text><rect x="47" y="174" width="106" height="60" rx="5" fill="#fcfbf9" stroke="#c8c0c8" stroke-width="1.5"/><text x="100.0" y="211.0" fill="#171419" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="500" text-anchor="middle">Task</text><rect x="215" y="110" width="132" height="62" rx="5" fill="#fcfbf9" stroke="#c8c0c8" stroke-width="1.5"/><text x="281.0" y="148.0" fill="#171419" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="500" text-anchor="middle">Agent A</text><rect x="215" y="236" width="132" height="62" rx="5" fill="#eee2e8" stroke="#b68a9f" stroke-width="1.5"/><text x="281.0" y="274.0" fill="#171419" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="500" text-anchor="middle">Agent B</text><rect x="408" y="174" width="106" height="60" rx="5" fill="#e4ebef" stroke="#3a617c" stroke-width="1.5"/><text x="461.0" y="211.0" fill="#171419" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="500" text-anchor="middle">Verify</text><path d="M153 204 H180 V141 H215" stroke="#3a617c" stroke-width="1.7" fill="none" marker-end="url(#arrow)"/><path d="M180 204 V267 H215" stroke="#3a617c" stroke-width="1.7" fill="none" marker-end="url(#arrow)"/><path d="M347 141 H376 V204 H408" stroke="#3a617c" stroke-width="1.7" fill="none" marker-end="url(#arrow)"/><path d="M347 267 H376 V211" stroke="#3a617c" stroke-width="1.7" fill="none" marker-end="url(#arrow)"/><text x="280" y="349" fill="#625d65" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" text-anchor="middle">Coordination is work, too.</text></svg>