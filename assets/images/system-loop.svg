<svg xmlns="http://www.w3.org/2000/svg" width="480" height="420" viewBox="0 0 480 420" role="img" aria-labelledby="title desc"><title id="title">The outcome is the evidence</title><desc id="desc">Define a task, act through tools, verify the resulting state, and inspect the evidence before iterating.</desc><defs><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".7" fill="#c8c0c8" opacity=".6"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 8 5 L 0 9" fill="none" stroke="#3a617c" stroke-width="1.5"/></marker></defs><rect width="480" height="420" fill="#efede8"/><rect x="18" y="18" width="444" height="384" fill="url(#grid)"/><text x="34" y="47" fill="#625d65" font-family="ui-monospace, monospace" font-size="10" font-weight="400" text-anchor="start">A SYSTEM, NOT JUST A MODEL</text><rect x="55" y="92" width="160" height="62" rx="5" fill="#fcfbf9" stroke="#c8c0c8" stroke-width="1.5"/><text x="135.0" y="130.0" fill="#171419" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="500" text-anchor="middle">Define the task</text><rect x="265" y="92" width="160" height="62" rx="5" fill="#fcfbf9" stroke="#c8c0c8" stroke-width="1.5"/><text x="345.0" y="130.0" fill="#171419" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="500" text-anchor="middle">Act with tools</text><rect x="265" y="250" width="160" height="62" rx="5" fill="#e4ebef" stroke="#3a617c" stroke-width="1.5"/><text x="345.0" y="288.0" fill="#171419" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="500" text-anchor="middle">Verify outcome</text><rect x="55" y="250" width="160" height="62" rx="5" fill="#eee2e8" stroke="#b68a9f" stroke-width="1.5"/><text x="135.0" y="288.0" fill="#171419" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="500" text-anchor="middle">Inspect evidence</text><path d="M215 123 L265 123" stroke="#3a617c" stroke-width="1.7" fill="none" marker-end="url(#arrow)"/><path d="M345 154 L345 250" stroke="#3a617c" stroke-width="1.7" fill="none" marker-end="url(#arrow)"/><path d="M265 281 L215 281" stroke="#3a617c" stroke-width="1.7" fill="none" marker-end="url(#arrow)"/><path d="M135 250 L135 154" stroke="#3a617c" stroke-width="1.7" fill="none" marker-end="url(#arrow)" stroke-dasharray="5 5"/><text x="364" y="207" fill="#625d65" font-family="ui-monospace, monospace" font-size="11" font-weight="400" text-anchor="start">check</text><text x="44" y="208" fill="#625d65" font-family="ui-monospace, monospace" font-size="11" font-weight="400" text-anchor="start">iterate</text><text x="34" y="373" fill="#625d65" font-family="ui-monospace, monospace" font-size="10" font-weight="400" text-anchor="start">TASK → ACTION → OUTCOME</text><text x="444" y="373" fill="#625d65" font-family="ui-monospace, monospace" font-size="10" font-weight="400" text-anchor="end">01</text></svg>